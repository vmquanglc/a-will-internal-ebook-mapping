<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nhất Niệm Vĩnh Hằng - Nhĩ Căn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: #312e81;
            --badge-text: #a5b4fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.2rem;
        }

        header .author {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.15rem;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1 1 100%;
            position: relative;
        }

        @media (min-width: 640px) {
            .search-box {
                flex: 1;
            }
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 16px; /* Prevent auto-zoom on iOS */
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        @media (min-width: 640px) {
            .btn-group {
                width: auto;
            }
        }

        .btn {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.88rem;
            text-align: center;
            white-space: nowrap;
        }

        .btn:active {
            background-color: var(--primary);
            border-color: var(--primary);
            transform: scale(0.98);
        }

        .volume-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 0.85rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: border-color 0.2s;
        }

        .volume-header {
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background-color: rgba(255, 255, 255, 0.02);
            transition: background-color 0.2s;
            position: relative;
        }

        .volume-header:active {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .volume-title-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .volume-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .volume-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .volume-range {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-right: 1.5rem;
        }

        .toggle-icon {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
            fill: var(--text-muted);
            flex-shrink: 0;
        }

        .volume-card.open .toggle-icon {
            transform: rotate(180deg);
        }

        .volume-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
            border-top: 1px solid transparent;
        }

        .volume-card.open .volume-content {
            max-height: 3000px;
            transition: max-height 0.3s ease-in-out;
            border-top-color: var(--card-border);
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 0.5rem;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 480px) {
            .chapter-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
                padding: 0.75rem;
            }
            
            .volume-header {
                padding: 0.9rem 1rem;
            }

            .volume-range {
                font-size: 0.82rem;
            }
        }

        .chapter-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.55rem 0.7rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .chapter-item .local {
            color: var(--text-main);
        }

        .chapter-item .global {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Nhất Niệm Vĩnh Hằng</h1>
        <div class="author">Tác giả: Nhĩ Căn</div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value">16</div>
            <div class="stat-label">Tổng Quyển</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">1,314</div>
            <div class="stat-label">Tổng Chương Gốc</div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm chương (vd: 198, Quyển 2)..." inputmode="numeric">
        </div>
        <div class="btn-group">
            <button class="btn" onclick="toggleAll(true)">Mở Tất Cả</button>
            <button class="btn" onclick="toggleAll(false)">Thu Gọn</button>
        </div>
    </div>

    <div id="volumeContainer"></div>
</div>

<script>
    const bookChapters = [64, 53, 66, 80, 63, 52, 83, 102, 102, 91, 98, 70, 104, 70, 115, 101];

    function buildData() {
        let globalCounter = 1;
        return bookChapters.map((count, index) => {
            const startGlobal = globalCounter;
            const chapters = [];
            for (let i = 1; i <= count; i++) {
                chapters.push({
                    local: i,
                    global: globalCounter++
                });
            }
            const endGlobal = globalCounter - 1;
            return {
                volume: index + 1,
                count: count,
                startGlobal: startGlobal,
                endGlobal: endGlobal,
                chapters: chapters
            };
        });
    }

    const data = buildData();

    function renderUI(dataToRender) {
        const container = document.getElementById('volumeContainer');
        container.innerHTML = '';

        dataToRender.forEach((vol) => {
            const card = document.createElement('div');
            card.className = 'volume-card';
            card.id = `vol-${vol.volume}`;

            card.innerHTML = `
                <div class="volume-header" onclick="toggleCard(this)">
                    <div class="volume-title-group">
                        <span class="volume-title">Quyển ${vol.volume}</span>
                        <span class="volume-badge">${vol.count} chương</span>
                    </div>
                    <div class="volume-range">
                        Gốc: <strong>${vol.startGlobal}</strong> &rarr; <strong>${vol.endGlobal}</strong>
                    </div>
                    <svg class="toggle-icon" viewBox="0 0 24 24">
                        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
                    </svg>
                </div>
                <div class="volume-content">
                    <div class="chapter-grid">
                        ${vol.chapters.map(ch => `
                            <div class="chapter-item">
                                <span class="local">Ch. ${ch.local}</span>
                                <span class="global">(${ch.global})</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function toggleCard(headerEl) {
        const card = headerEl.parentElement;
        card.classList.toggle('open');
    }

    function toggleAll(open) {
        const cards = document.querySelectorAll('.volume-card');
        cards.forEach(card => {
            if (open) {
                card.classList.add('open');
            } else {
                card.classList.remove('open');
            }
        });
    }

    // Xử lý tìm kiếm
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.trim().toLowerCase();
        
        if (!query) {
            renderUI(data);
            return;
        }

        const filtered = data.map(vol => {
            const matchVolName = `quyển ${vol.volume}`.includes(query) || `quyen ${vol.volume}`.includes(query);
            
            const matchedChapters = vol.chapters.filter(ch => {
                const searchNum = parseInt(query);
                if (!isNaN(searchNum)) {
                    return ch.local === searchNum || ch.global === searchNum;
                }
                return `chương ${ch.local}`.includes(query) || `chương ${ch.global}`.includes(query);
            });

            if (matchVolName || matchedChapters.length > 0) {
                return {
                    ...vol,
                    chapters: matchedChapters.length > 0 ? matchedChapters : vol.chapters
                };
            }
            return null;
        }).filter(Boolean);

        renderUI(filtered);
        
        if (query) {
            toggleAll(true);
        }
    });

    // Khởi chạy ban đầu
    renderUI(data);
</script>

</body>
</html>
